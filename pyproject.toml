[project]
name = "flask-cors"
dynamic = ["version"]
description = "A Flask extension simplifying CORS support"
authors = [{ name = "Cory Dolphin", email = "corydolphin@gmail.com" }]
readme = "README.rst"
keywords = ['python']
license = "MIT"
requires-python = ">=3.9,<4.0"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "flask>=0.9",
    "Werkzeug>=0.7",
    # Provides typing.Unpack (PEP 692) for typing **kwargs on Python < 3.11.
    "typing_extensions>=4.6.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://corydolphin.github.io/flask-cors/"
Repository = "https://github.com/corydolphin/flask-cors"
Documentation = "https://corydolphin.github.io/flask-cors/"

[dependency-groups]
dev = [
    "pytest>=7.2.0",
    "pre-commit>=2.20.0",
    "tox-uv>=1.11.3",
    "deptry>=0.22.0",
    "mypy>=0.991",
    "pytest-cov>=4.0.0",
    "ruff>=0.9.2",
    "mkdocs>=1.4.2",
    "mkdocs-material>=8.5.10",
    "mkdocstrings[python]>=0.26.1",
]

[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
# The version is derived from the latest git tag. For source archives
# generated by GitHub (`git archive`), the version is recovered from the
# substituted values in .git_archival.txt (see .gitattributes export-subst).
# fallback_version is only used when building outside of a git checkout and
# without archival metadata.
fallback_version = "0.0.0"

[tool.setuptools]
packages = ["flask_cors"]
# This is a workaround for https://github.com/astral-sh/uv/issues/9513
license-files = []

[tool.setuptools.package-data]
# Ship the PEP 561 marker so downstream consumers pick up our type hints.
flask_cors = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.deptry.per_rule_ignores]
# typing_extensions is only imported under TYPE_CHECKING (for PEP 692 Unpack on
# Python < 3.11), so deptry cannot see it being used.
DEP002 = ["typing_extensions"]

[tool.mypy]
files = ["flask_cors"]
python_version = "3.9"
strict = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py39"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # flake8-type-checking
    "TC",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
    # RaiseVanillaArgs: inline exception messages are intentional here; the
    # spec-citing messages are more useful than custom exception classes.
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
preview = true

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["flask_cors"]
